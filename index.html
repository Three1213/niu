<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="安规刷题">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>安规刷题</title>

<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --line:#d3dae1; --line-strong:#b3bec9;
  --ink:#15212b; --ink-2:#4a5a68; --ink-3:#7b8b99;
  --accent:#14618f; --accent-ink:#ffffff; --accent-soft:#e3eef5;
  --ok:#0e7052; --ok-soft:#dff0e9; --bad:#a9342a; --bad-soft:#f8e4e1;
  --warn:#8a5a00; --warn-soft:#fbeed2;
  --shadow:0 1px 2px rgba(21,33,43,.07),0 6px 18px -10px rgba(21,33,43,.22);
  --scrim:rgba(13,21,28,.42);
  --fs:1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d151c; --surface:#16212b; --surface-2:#1d2a35; --line:#2c3b48; --line-strong:#3d505f;
  --ink:#e4ecf2; --ink-2:#a3b4c1; --ink-3:#71838f;
  --accent:#4ea3d8; --accent-ink:#06121b; --accent-soft:#17303f;
  --ok:#4cbf96; --ok-soft:#12332a; --bad:#e58579; --bad-soft:#3a1e1a;
  --warn:#d9a640; --warn-soft:#33270f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0d151c; --surface:#16212b; --surface-2:#1d2a35; --line:#2c3b48; --line-strong:#3d505f;
  --ink:#e4ecf2; --ink-2:#a3b4c1; --ink-3:#71838f;
  --accent:#4ea3d8; --accent-ink:#06121b; --accent-soft:#17303f;
  --ok:#4cbf96; --ok-soft:#12332a; --bad:#e58579; --bad-soft:#3a1e1a;
  --warn:#d9a640; --warn-soft:#33270f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* 顶栏 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:780px;margin:0 auto;padding:8px 12px 8px 16px;display:flex;align-items:center;gap:6px;min-height:52px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icobtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.icobtn:hover{background:var(--surface-2)}
.icobtn svg,.btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.txtbtn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--bad);color:var(--bad);font-size:13.5px;font-weight:600;flex:none}
.bar{height:3px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .25s ease;display:block}

.wrap{max-width:780px;margin:0 auto;padding:16px;padding-block:16px 110px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.lab{font-size:11px;letter-spacing:.12em;color:var(--ink-3);font-weight:500}

/* 首页 */
.hero{padding:18px;display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.hero h1{margin:0;font-size:22px;line-height:1.3;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kpi{display:flex;flex-direction:column}
.kpi b{font-size:20px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--ink-3)}
.banks{display:flex;flex-direction:column;gap:9px;padding-top:12px;border-top:1px solid var(--line)}
.bk{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.bk .nm{font-weight:560}
.bk .st{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.bk .pg{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;position:relative}
.bk .pg i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}

.sec{margin:18px 2px 8px;display:flex;align-items:baseline;gap:10px}
.sec h2{margin:0;font-size:14px;font-weight:650}
.sec em{font-style:normal;font-size:12px;color:var(--ink-3)}
.box{padding:14px;display:flex;flex-direction:column;gap:12px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frow>.lab{width:44px;flex:none}
.chip{min-height:36px;padding:5px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:13.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:560}
.chip .n{opacity:.65;font-size:11.5px;margin-left:4px;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--ink-3)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;width:100%;text-align:left}
.sw span{font-size:14px}
.sw small{display:block;font-size:12px;color:var(--ink-3);line-height:1.4}
.tg{flex:none;width:46px;height:28px;border-radius:99px;background:var(--line-strong);position:relative;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"] .tg{background:var(--accent)}
.sw[aria-checked="true"] .tg::after{transform:translateX(18px)}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{padding:14px;text-align:left;border-radius:13px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-height:78px}
.mode:active{transform:scale(.985)}
.mode b{font-size:15px;font-weight:640}
.mode span{font-size:12px;color:var(--ink-2);line-height:1.45}
.mode.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mode.pri span{color:var(--accent-ink);opacity:.85}
.mode .cnt{font-variant-numeric:tabular-nums}
.mode.hot{border-color:var(--warn);background:var(--warn-soft)}
.hist{display:flex;flex-direction:column}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:13px}
.hrow:first-child{border-top:0}
.hrow b{font-variant-numeric:tabular-nums}
.hrow b.pass{color:var(--ok)} .hrow b.fail{color:var(--bad)}

/* 掌握度 / 今日 / 专项 */
.mb{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.mb i{display:block;height:100%}
.mb .m3{background:var(--ok)} .mb .m2{background:var(--accent)} .mb .m1{background:var(--bad)}
.mleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mleg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.today{padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:4px}
.today .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.today h2{margin:0;font-size:15px;font-weight:650}
.today .row span{font-size:12px;color:var(--ink-3)}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tstats div{padding:9px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.tstats b{display:block;font-size:19px;font-weight:620;line-height:1.2;font-variant-numeric:tabular-nums}
.tstats span{font-size:11.5px;color:var(--ink-3)}
.tstats .due b{color:var(--warn)}
.bigbtn{height:54px;border-radius:13px;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:640;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.bigbtn small{font-size:12.5px;font-weight:500;opacity:.85}
.subbtn{height:44px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-size:14.5px;font-weight:580;width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.subbtn span{font-size:12.5px;color:var(--ink-3);font-weight:500}
.tplist{display:flex;flex-direction:column;gap:8px}
.tp{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:6px}
.tp .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tp b{font-size:15px;font-weight:620}
.tp .row span{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chlist{display:flex;flex-direction:column;gap:8px}
.chap{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.chap>summary{list-style:none;padding:13px 14px;cursor:pointer;display:flex;flex-direction:column;gap:7px}
.chap>summary::-webkit-details-marker{display:none}
.chap .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chap>summary b{font-size:15px;font-weight:640;padding-left:16px;position:relative}
.chap>summary b::before{content:"";position:absolute;left:1px;top:.42em;width:7px;height:7px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);transition:transform .15s}
.chap[open]>summary b::before{transform:rotate(45deg);top:.3em}
.chap .row span,.chap .row2>span{font-size:12px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.chap .row2{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.chap .tplist{padding:0 10px 10px}
.chap .tp{background:var(--surface-2)}
.chap .tp.whole{border-style:dashed}
.sno{display:inline-block;min-width:2.6em;color:var(--accent);font-weight:600;margin-right:4px}
.tp.weak{border-color:var(--bad)}
.tag.why-复习{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.tag.why-薄弱{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.tag.why-新题,.tag.why-巩固{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.tag.lv{background:transparent;color:var(--ink-3);border-color:var(--line)}
.srcl{font-size:11.5px!important;color:var(--ink-3)!important;margin-top:6px!important}
.verdict p .warn{color:var(--warn)}
.nextrev{font-size:12px;color:var(--ink-3);margin-top:6px}

/* 题目 */
.card{padding:18px}
.qhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:560;border:1px solid transparent;line-height:1.6}
.t-single{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.t-multi{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.t-judge{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.tag.hot{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.subbtn.hotbtn{border-color:var(--accent);color:var(--accent)}
.subbtn.hotbtn span{color:var(--ink-3)}
.t-qa{background:var(--surface-2);color:var(--ink-2);border-color:var(--line-strong)}
.btn.wide{width:100%;height:46px}
.verdict p.ref{white-space:pre-wrap}
.selfrow{margin-top:10px}
.selfrow .lab{display:block;font-size:12.5px;color:var(--ink-3);margin-bottom:6px}
.selfrow .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.tag.src{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.tag.wr{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.qidx{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.stem{font-size:calc(16.5px * var(--fs));line-height:1.75;margin:0 0 14px;font-weight:500}
.stem mark,.res mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 1px}
.mhint{font-size:12px;color:var(--warn);margin:-8px 0 10px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;padding:12px 13px;min-height:50px;border:1.5px solid var(--line);border-radius:11px;background:var(--surface-2);line-height:1.6;transition:border-color .12s,background .12s}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12.5px;font-weight:650;background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-2);margin-top:1px}
.t-multi-q .opt .k{border-radius:5px}
.opt .tx{flex:1;font-size:calc(15px * var(--fs))}
.opt .mk{flex:none;font-size:12px;font-weight:650;margin-top:2px}
.opt[data-s="pick"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[data-s="pick"] .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[data-s="ok"]{border-color:var(--ok);background:var(--ok-soft)}
.opt[data-s="ok"] .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt[data-s="ok"] .mk{color:var(--ok)}
.opt[data-s="bad"]{border-color:var(--bad);background:var(--bad-soft)}
.opt[data-s="bad"] .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[data-s="bad"] .mk{color:var(--bad)}
.opt[data-s="miss"]{border-color:var(--ok);border-style:dashed}
.opt[data-s="miss"] .k{color:var(--ok);border-color:var(--ok)}
.opt[data-s="miss"] .mk{color:var(--ok)}
.verdict{margin-top:14px;padding:13px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2)}
.verdict.ok{border-color:var(--ok);background:var(--ok-soft)}
.verdict.bad{border-color:var(--bad);background:var(--bad-soft)}
.vtop{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:650;margin-bottom:4px}
.vtop .ans{margin-left:auto;font-weight:500;color:var(--ink-2);font-size:13px}
.verdict p{margin:0;font-size:13px;line-height:1.65;color:var(--ink-2)}
.swipehint{text-align:center;font-size:11.5px;color:var(--ink-3);margin-top:12px}

/* 底部栏 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:9px 12px;padding-bottom:calc(9px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:780px;margin:0 auto;display:flex;gap:8px;align-items:center}
.btn{height:46px;padding:0 14px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);font-size:14.5px;font-weight:580;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1;max-width:220px;margin-left:auto}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sq{width:46px;padding:0;flex:none}
.btn.sheetbtn{flex:none;font-variant-numeric:tabular-nums;font-size:13.5px}
.star[aria-pressed="true"]{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.star[aria-pressed="true"] svg{fill:currentColor}
.timer{height:46px;display:inline-flex;align-items:center;padding:0 10px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.timer.low{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}

/* 答题卡 / 弹层 */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);animation:fade .15s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;max-height:82vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .2s ease;box-shadow:0 -10px 30px -10px rgba(0,0,0,.3)}
.sheet-in{max-width:780px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0;flex:1}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.sh-head b{font-size:16px;flex:1}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:0 16px 10px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line-strong)}
.grid{overflow-y:auto;padding:4px 16px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px;-webkit-overflow-scrolling:touch}
.cell{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.cell.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.cell.cur{outline:2.5px solid var(--ink);outline-offset:1px}
.sh-foot{padding:10px 16px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
.sh-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.sh-body p{margin:0;font-size:13.5px;color:var(--ink-2)}
.opt-card{padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);text-align:left;display:flex;justify-content:space-between;align-items:center}
.opt-card b{font-size:15px}
.opt-card span{font-size:12.5px;color:var(--ink-3)}
textarea.code{width:100%;min-height:150px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-2);padding:10px;font-size:16px;font-family:ui-monospace,Menlo,monospace;resize:vertical}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* 搜索 */
.search{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:5;margin-bottom:10px}
.search input{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--surface);padding:0 14px;font-size:16px}
.search input:focus{border-color:var(--accent);outline:none}
.reslist{display:flex;flex-direction:column;gap:8px}
.res{padding:12px 14px;text-align:left;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.res p{margin:0;font-size:14px;line-height:1.6}
.res small{font-size:12px;color:var(--ink-3)}
.res small b{color:var(--ok);font-weight:600}

/* 结算 */
.score{padding:22px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.score .big{font-size:52px;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums}
.big.pass{color:var(--ok)} .big.fail{color:var(--bad)}
.score .sub{color:var(--ink-2);font-size:13.5px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;width:100%}

作？","options":[],"answer":[],"ref":"雷电时，禁止就地倒闸操作；雷电时也禁止在室外进行倒闸操作；设备有异常、操作中发生疑问时应停止操作并报告；防误操作闭锁装置失灵且未经批准时不准解锁操作。","exp":"变电安规5.3.6.9、5.3.6.13、5.3.6.5：规定了雷电天气、发生疑问和未经批准解锁时的操作限制。","src":"自编 · 依据 Q/GDW 1799.1—2013 第5章","tp":["工作票与操作票"],"jie":"5.3","hot":1},{"id":"XW12","type":"qa","ch":"ZB","sec":"5.3","stem":"倒闸操作前应做好哪些准备和核对工作？","options":[],"answer":[],"ref":"应根据值班调控人员或运维负责人的指令，受令人复诵无误后执行；发布指令应准确、清晰，使用规范的调度术语和设备双重名称；操作人和监护人应根据模拟图或接线图核对所填写的操作项目并分别签名；现场开始操作前，应先在模拟图（或微机防误装置、微机监控装置）上进行核对性模拟预演，无误后再核对设备名称、编号和位置，操作中应执行监护复诵制度。","exp":"变电安规5.3.1、5.3.4、5.3.6：倒闸操作的接令、填票、模拟预演、核对设备和监护复诵要求。","src":"自编 · 依据 Q/GDW 1799.1—2013 第5章","tp":["工作票与操作票"],"jie":"5.3","hot":1},{"id":"XW13","type":"qa","ch":"ZB","sec":"5.3","stem":"哪些项目应填入操作票内？","options":[],"answer":[],"ref":"a）应拉合的设备[断路器（开关）、隔离开关（刀闸）、接地刀闸（装置）等]，验电，装拆接地线，合上（安装）或断开（拆除）控制回路或电压互感器回路的空气开关、熔断器，切换保护回路和检验是否确无电压等。b）拉合设备[断路器（开关）、隔离开关（刀闸）、接地刀闸（装置）等]后检查设备的位置。c）进行停、送电操作时，在拉合隔离开关（刀闸）、手车式开关拉出、推入前，检查断路器（开关）确在分闸位置。d）在进行倒负荷或解、并列操作前后，检查相关电源运行及负荷分配情况。e）设备检修后合闸送电前，检查送电范围内接地刀闸（装置）已拉开，接地线已拆除。","exp":"变电安规5.3.4.3：规定了应填入操作票的五类项目。","src":"自编 · 依据 Q/GDW 1799.1—2013 第5章","tp":["工作票与操作票","停电·验电·接地","二次与试验","配电与低压"],"jie":"5.3","hot":1},{"id":"XW14","type":"qa","ch":"ZB","sec":"5.3","stem":"倒闸操作中，哪些情况禁止解锁？解锁需要什么程序？","options":[],"answer":[],"ref":"单人操作、检修人员在倒闸操作过程中禁止解锁。如需解锁，应待增派运维人员到现场后，履行解锁程序。若遇特殊情况需解锁操作，应经运维管理部门防误操作装置专责人或运维管理部门指定并经书面公布的人员到现场核实无误并签字后，由运维人员告知当值调控人员，方能使用解锁工具（钥匙）。解锁工具（钥匙）应封存保管。","exp":"变电安规5.3.6.5：规定了解锁的限制条件与解锁程序。","src":"自编 · 依据 Q/GDW 1799.1—2013 第5章","tp":["工作票与操作票"],"jie":"5.3","hot":1},{"id":"XW15","type":"qa","ch":"ZB","sec":"5.3","stem":"操作中发生疑问时应如何处理？","options":[],"answer":[],"ref":"操作中发生疑问时，应立即停止操作并向发令人报告，弄清问题后，再进行操作。不准擅自更改操作票，不准随意解除闭锁装置。","exp":"变电安规5.3.6.13：规定了操作发生疑问时的处理原则。","src":"自编 · 依据 Q/GDW 1799.1—2013 第5章","tp":["工作票与操作票"],"jie":"5.3","hot":1},{"id":"P003","type":"single","ch":"ZB","sec":"5.3","stem":"单人操作时也应（  ）。","options":["免于唱票","高声唱票","事后补记","只做记录"],"answer":["B"],"exp":"变电安规5.3.6.2：操作中应认真执行监护复诵制度（单人操作时也应高声唱票），宜全过程录音。 人员撤离工作地点。b）将该系统的所有工作票收回，拆除临时遮栏、接地线和标示牌，恢复常设遮栏。c）应在工作负责人和运维人员进行全面检查无误后，由运维人员进行加压试验。工作班若需继续工作时，应重新履行工作许可手续。","exp":"变电安规6.6.3：规定了试加工作电压的三个条件。","src":"自编 · 依据 Q/GDW 1799.1—2013 第6章","tp":["工作票与操作票","停电·验电·接地","标示牌与遮栏","二次与试验"],"jie":"6.6","hot":1},{"id":"XW29","type":"qa","ch":"ZB","sec":"6.6","stem":"工作终结需要履行哪些手续？","options":[],"answer":[],"ref":"全部工作完毕后，工作班应清扫、整理现场。工作负责人应先周密地检查，待全体作业人员撤离工作地点后，再向运维人员交待所修项目、发现的问题、试验结果和存在问题等，并与运维人员共同检查设备状况、状态，有无遗留物件，是否清洁等，然后在工作票上填明工作结束时间，经双方签名后，表示工作终结。待工作票上的临时遮栏已拆除，标示牌已取下，已恢复常设遮栏，未拆除的接地线、未拉开的接地刀闸（装置）等设备运行方式已汇报调控人员，工作票方告终结。","exp":"变电安规6.6.5：规定了工作终结和工作票终结的手续。","src":"自编 · 依据 Q/GDW 1799.1—2013 第6章","tp":["工作票与操作票","停电·验电·接地","标示牌与遮栏","二次与试验","配电与低压"],"jie":"6.6","hot":1},{"id":"PB028","type":"judge","ch":"ZB","sec":"6.6","stem":"在未办理工作票终结手续以前，任何人员不准将停电设备合闸送电。","options":["对","错"],"answer":["A"],"exp":"变电安规6.6.2：在未办理工作票终结手续以前，任何人员不准将停电设备合闸送电。","src":"自编 · 依据 Q/GDW 1799.1—2013 第6章（标注重点）","jie":"6.6","tp":["工作票与操作票","停电·验电·接地"],"hot":1},{"id":"W006","type":"qa","ch":"U-BD","sec":"单位题库·变电问答","stem":"全部工作完毕，工作负责人还需履行哪些手续后，方表示工作终结？","options":[],"answer":[],"exp":"变电安规6.6.5：全部工作完毕后，工作负责人应周密检查，待全体作业人员撤离工作地点后，向运维人员交待所修项目、发现的问题、试验结果和存在问题，共同检查设备状况，填明工作结束时间，经双方签名后工作终结。","src":"安规题库.xls（变电部分）问答题第6题","tp":["工作票与操作票","二次与试验"],"jie":"6.6","ref":"工作负责人应先周密地检查，待全体作业人员撤离工作地点后，再向运维人员交待所修项目、发现的问题、试验结果和存在问题等，并与运维人员共同检查设备状况、状态，有无遗留物件，是否清洁等，然后在工作票上填明工作结束时间。经双方签名后，表示工作终结。","hot":1},{"id":"R045","type":"single","ch":"U-YX","sec":"变电运行题库","stem":"工作间断次日复工时，工作负责人应电话告知（ ），并重新认真检查确认安全措施是否符合工作票要求。","options":["专责监护人","工作班成员","工作许可人","工作票签发人"],"answer":["C"],"exp":"变电安规6.6.1：“次日复工时，工作负责人应电话告知工作许可人，并重新认真检查确认安全措施是否符合工作票要求。”","src":"变电运行题库.docx 第51题","tp":["工作票与操作票"],"jie":"6.6","hot":1},{"id":"R106","type":"multi","ch":"U-YX","sec":"变电运行题库","stem":"工作终结后，还需完成以下（ ）工作，工作票方告终结。","options":["拆除工作票上的临时遮栏","取下标示牌","拆除常设遮栏","未拆除的接地线、未拉开的接地刀闸（装置）等设备运行方式汇报调控人员"],"answer":["A","B","D"],"exp":"变电安规6.6.5：“待工作票上的临时遮栏已拆除，标示牌已取下，已恢复常设遮栏，未拆除的接地线、未拉开的接地刀闸（装置） 等设备运行方式已汇报调控人员，工作票方告终结。”","s var DAY=864e5,INT=[0,1,2,4,7,15,30],LV=['未学','薄弱','学习中','已掌握'];

function smartIds(P,n){
  var now=Date.now(),out=[],why={};
  var due=P.filter(function(q){var r=S.rec[q.id];return r&&dueAt(r)<=now;}).sort(function(a,b){return dueAt(S.rec[a.id])-dueAt(S.rec[b.id]);});
  var used={};
  function take(list,k,tag){list.slice(0,Math.max(0,k)).forEach(function(q){if(!used[q.id]){used[q.id]=1;out.push(q.id);why[q.id]=tag;}});}
  take(due,n,'复习');
  var left=n-out.length;
  var weak=P.filter(function(q){var r=S.rec[q.id];return r&&!used[q.id]&&lvl(r)<=1;}).sort(function(a,b){return errRate(b)-errRate(a);});
  var fresh=shuffle(P.filter(function(q){return !S.rec[q.id];}));
  var wN=Math.min(weak.length,Math.ceil(left*0.3)),fN=Math.min(fresh.length,left-wN);wN=Math.min(weak.length,left-fN);
  var mix=[];take(weak,wN,'薄弱');take(fresh,fN,'新题');
  left=n-out.length;
  if(left>0){var learn=P.filter(function(q){var r=S.rec[q.id];return r&&!used[q.id]&&lvl(r)===2;}).sort(function(a,b){return dueAt(S.rec[a.id])-dueAt(S.rec[b.id]);});take(learn,left,'巩固');}
  var nd=out.filter(function(id){return why[id]==='复习';}),rest=shuffle(out.filter(function(id){return why[id]!=='复习';}));
  return {ids:nd.concat(rest),why:why,due:nd.length};
}

function pick(k){
  var q=QM[R.ids[R.i]],i=R.i;
  if(isReveal(i))return;
  var p=(R.ans[i]||[]).slice();
  if(q.type==='multi'){var n=p.indexOf(k);if(n<0)p.push(k);else p.splice(n,1);p.sort();
    if(p.length)R.ans[i]=p;else delete R.ans[i];
    if(R.mode==='exam')saveExam();
    return renderQ();}
  R.ans[i]=[k];
  if(R.mode==='exam'){saveExam();renderQ();if(i<R.ids.length-1){autoT=setTimeout(function(){if(R.i===i)move(1);},280);}return;}
  submit();
}
function selfGrade(ok){
  var i=R.i,q=QM[R.ids[i]];
  R.sub[i]=true;R.selfOk[i]=ok;R.ans[i]=['-'];
  var r=record(q,ok);save();
  if(!ok)R.sessionWrong[q.id]=1;
  renderQ();
  if(r==='cleared')toast('已答对 '+S.set.clear+' 次，移出错题本');
  if(ok&&S.set.auto&&i<R.ids.length-1){autoT=setTimeout(function(){if(R.i===i&&R.sub[i])move(1);},600);}
}
function submit(){
  var i=R.i,q=QM[R.ids[i]],p=R.ans[i]||[];
  if(!p.length)return;
  R.sub[i]=true;
  var ok=same(p,q.answer);
  var r=record(q,ok);save();
  if(!ok)R.sessionWrong[q.id]=1;
  renderQ();
  if(r==='cleared')toast('已答对 '+S.set.clear+' 次，移出错题本');
  if(ok&&S.set.auto&&i<R.ids.length-1){autoT=setTimeout(function(){if(R.i===i&&R.sub[i])move(1);},600);}
}
function move(d){
  var n=R.i+d;
  if(n<0)return toast('已经是第一题');
  if(n>=R.ids.length){
    if(R.mode==='exam')return confirmHand();
    if(R.mode==='review')return renderExamResult(R.exam);
    return finishSet();
  }
  R.i=n;renderQ();
}

var tx=0,ty=0,tt=0,tracking=false;
function isQuiz(){return ['seq','rnd','read','wrong','star','exam','review','smart','topic'].indexOf(R.mode)>=0;}
view.addEventListener('touchstart',function(e){if(!isQuiz()||e.touches.length>1)return;tracking=true;tx=e.touches[0].clientX;ty=e.touches[0].clientY;tt=Date.now();},{passive:true});
view.addEventListener('touchend',function(e){
  if(!tracking||!isQuiz())return;tracking=false;
  var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;

},{passive:true});

function showTopic(r){
  var ids=r.list.map(function(q){return q.id;}),wr=ids.filter(function(id){return S.wb[id];}),dN=dueCount(r.list),n=Math.min(30,ids.length);

function showExamPick(){
  var P=pool().filter(function(q){return q.type!=='qa';}),s=P.filter(function(q){return q.type==='single';}).length,m=P.filter(function(q){return q.type==='multi';}).length,j=P.filter(function(q){return q.type==='judge';}).length;
  var scope=S.filt.ch.length?S.filt.ch.map(function(k){return CH.filter(function(c){return c.k===k;})[0].n;}).join('、'):'全部题库';
  var cards=EXAMS.map(function(e,x){return '<button class="opt-card" data-x="'+x+'"><div><b>'+e.n+' 题 · '+e.min+' 分钟</b><br><span>'+e.d+'</span></div><span>开始 ›</span></button>';}).join('');
  openLayer('<div class="sh-head"><b>模拟考试</b><button class="icobtn" data-close aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sh-body"><p>出题范围：'+esc(scope)+(S.filt.ty.length?'（仅所选题型）':'')+'，可用 单选 '+s+' · 多选 '+m+' · 判断 '+j+'（简答题不参加模拟考试）。单选、判断每题 1 分，多选每题 2 分，按百分制折算，80 分合格。中途退出会保存进度，关掉页面时计时暂停。</p>'+cards+'</div>');
  [].forEach.call(layer.querySelectorAll('[data-close]'),function(b){b.onclick=closeLayer;});
  [].forEach.call(layer.querySelectorAll('.opt-card'),function(b){b.onclick=function(){closeLayer();startExam(EXAMS[+b.dataset.x]);};});
}
function startExam(cfg){
  var P=pool(),k=cfg.n/50;
  var s=shuffle(P.filter(function(q){return q.type==='single';})).slice(0,25*k);
  var m=shuffle(P.filter(function(q){return q.type==='multi';})).slice(0,10*k);
  var j=shuffle(P.filter(function(q){return q.type==='judge';})).slice(0,15*k);
  var ids=s.concat(m,j).map(function(q){return q.id;});
  if(!ids.length)return toast('所选范围没有题目');
  S.exam={ids:ids,log:{},left:cfg.min*60,total:cfg.min*60,i:0,warned:false};save();
  resumeExam();
}
function resumeExam(){
  var E=S.exam;if(!E)return renderHome();
  R={mode:'exam',ids:E.ids,i:E.i||0,ans:E.log,sub:{},title:'模拟考试',exam:E,sessionWrong:{}};
  $('bHome').hidden=false;$('bSearch').hidden=true;$('bHand').hidden=false;
  $('ttl').textContent='模拟考试';
  startTimer();renderQ();
}
function saveExam(){if(R.mode==='exam'&&S.exam){S.exam.log=R.ans;S.exam.i=R.i;save();}}
var timerId=null,lastTick=0;
function startTimer(){
  stopTimer();lastTick=Date.now();
  timerId=setInterval(function(){
    var E=S.exam;if(!E||R.mode!=='exam')return stopTimer();
    var now=Date.now();E.left-=(now-lastTick)/1000;lastTick=now;
    var el=$('tmr');if(el){el.textContent=fmt(E.left);el.className='timer mono'+(E.left<300?' low':'');}
    if(E.left<300&&!E.warned){E.warned=true;toast('还剩 5 分钟');}
    if(Math.round(E.left)%5===0)save();
    if(E.left<=0){stopTimer();handIn(true);}
  },1000);
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}if(R.mode==='exam')saveExam();}
function confirmHand(){
  var un=R.ids.length-Object.keys(R.ans).length;
  if(!confirm(un?('还有 '+un+' 题没答，确定交卷？'):'全部答完了，确定交卷？'))return;
  handIn(false);
}
function handIn(timeup){
  stopTimer();
  var E=S.exam,res={t:Date.now(),n:E.ids.length,used:E.total-Math.max(0,E.left),timeup:timeup,ids:E.ids,log:E.log,by:{single:[0,0],multi:[0,0],judge:[0,0]}};
  var got=0,tot=0;
  E.ids.forEach(function(id,i){
    var q=QM[id],p=E.log[i]||[],ok=p.length&&same(p,q.answer),w=q.type==='multi'?2:1;
    tot+=w;if(ok)got+=w;res.by[q.type][1]++;if(ok)res.by[q.type][0]++;
    if(p.length)record(q,!!ok);
  });
  res.score=pct(got,tot);
  S.hist.unshift({t:res.t,n:res.n,score:res.score,used:res.used});S.hist=S.hist.slice(0,20);
  S.exam=null;save();
  $('bHand').hidden=true;
  renderExamResult(res);
}
function renderExamResult(res){
  R={mode:'result',ids:res.ids,i:0,ans:res.log,sub:{},title:'考试成绩',exam:res,sessionWrong:{}};
  dock.hidden=true;prog.style.width='100%';$('ttl').textContent='考试成绩';$('sub').textContent=res.n+' 题 · 用时 '+fmt(res.used);
  $('bHome').hidden=false;$('bHand').hidden=true;
  var wrongIdx=[];res.ids.forEach(function(id,i){var p=res.log[i]||[];if(!p.length||!same(p,QM[id].answer))wrongIdx.push(i);});
  var b=res.by,pass=res.score>=80;
  var h='<div class="panel score"><span class="lab">'+(res.timeup?'时间到，已自动交卷':'模拟考试成绩')+'</span><div class="big mono '+(pass?'pass':'fail')+'">'+res.score+'</div>'
    +'<div class="sub">'+(pass?'合格':'未到 80 分合格线')+' · 用时 '+fmt(res.used)+' · 错 '+wrongIdx.length+' 题</div>'
    +'<div class="g3"><div class="stat"><b class="mono">'+b.single[0]+'/'+b.single[1]+'</b><span>单选</span></div><div class="stat"><b class="mono">'+b.multi[0]+'/'+b.multi[1]+'</b><span>多选</span></div><div class="stat"><b class="mono">'+b.judge[0]+'/'+b.judge[1]+'</b><span>判断</span></div></div></div>';
  h+='<div class="acts">'+(wrongIdx.length?'<button class="mode pri" id="rWrong"><b>看错题</b><span>'+wrongIdx.length+' 题，含答案</span></button>':'')
    +'<button class="mode" id="rAll"><b>看整张卷</b><span>逐题回看对错</span></button>'
    +'<button class="mode" id="rAgain"><b>再考一次</b><span>重新抽题计时</span></button>'
    +'<button class="mode" id="rHome"><b>返回首页</b><span>答错的已进错题本</span></button></div>';
  view.innerHTML=h;
  var review=function(onlyWrong){
    var idx=onlyWrong?wrongIdx:res.ids.map(function(_,i){return i;});
    var ids=idx.map(function(i){return res.ids[i];}),log={};idx.forEach(function(i,n){if(res.log[i])log[n]=res.log[i];});
    R={mode:'review',ids:ids,i:0,ans:log,sub:{},title:onlyWrong?'考试错题':'整卷回看',exam:res,sessionWrong:{}};
    $('ttl').textContent=R.title;renderQ();
  };
  if($('rWrong'))$('rWrong').onclick=function(){review(true);};
  $('rAll').onclick=function(){review(false);};
  $('rAgain').onclick=showExamPick;$('rHome').onclick=renderHome;
  window.scrollTo(0,0);
}
$('bHand').onclick=confirmHand;

/* ================= 返回 ================= */
$('bHome').onclick=function(){
  if(R.mode==='exam'){saveExam();toast('考试进度已保存，可在首页继续');}
  else if(R.mode==='search'||R.mode==='')return renderHome();
  renderHome();
};

/* ================= 搜索 ================= */
var searchQ='';
$('bSearch').onclick=function(){renderSearch();};
function renderSearch(){
  closeLayer();dock.hidden=true;R={mode:'search',ids:[],i:0,ans:{},sub:{},title:'搜索',exam:null,sessionWrong:{}};
  $('bHome').hidden=false;$('bSearch').hidden=true;$('ttl').textContent='搜索题目';$('sub').textContent='按题干或选项里的关键词查找';prog.style.width='0';
  view.innerHTML='<div class="search"><input id="sq" type="search" placeholder="输入关键词，如 接地线、动火、安全距离" autocomplete="off" value="'+esc(searchQ)+'"></div><div class="reslist" id="res"></div>';
  var inp=$('sq'),t;
  inp.oninput=function(){clearTimeout(t);t=setTimeout(function(){searchQ=inp.value.trim();doSearch();},150);};
  doSearch();setTimeout(function(){inp.focus();},50);
}
function doSearch(){
  var box=$('res');if(!box)return;var k=searchQ;
  if(!k){box.innerHTML='<div class="empty"><b>输入关键词开始搜索</b>在 '+QS.length+' 道题的题干和选项里查找</div>';return;}
  var hits=QS.filter(function(q){return q.stem.indexOf(k)>=0||q.options.some(function(o){return o.indexOf(k)>=0;});});
  if(!hits.length){box.innerHTML='<div class="empty"><b>没有找到"'+esc(k)+'"</b>换个短一点的词试试</div>';return;}
  var re=new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');
  var mark=function(s){return esc(s).replace(re,function(m){return '<mark>'+m+'</mark>';});};
  var shown=hits.slice(0,80);
  box.innerHTML='<div class="hint">找到 '+hits.length+' 题'+(hits.length>80?'，显示前 80 题':'')+'，点开可看完整题目</div>'+shown.map(function(q,n){
    var src=(CH.filter(function(c){return c.k===q.ch;})[0]||{}).n;
    var ans=q.type==='qa'?'简答题（参考答案见题目）':q.answer.map(function(a){return q.type==='judge'?q.options[L.indexOf(a)]:a+'. '+q.options[L.indexOf(a)];}).join('；');
    return '<button class="res" data-n="'+n+'"><p>'+mark(q.stem)+'</p><small>'+TN[q.type]+' · '+src+' · 答案 <b>'+esc(ans)+'</b></small></button>';
  }).join('');
  [].forEach.call(box.querySelectorAll('.res'),function(b){b.onclick=function(){
    begin('read',shown.map(function(q){return q.id;}),'搜索结果',+b.dataset.n);
  };});
}

/* ================= 备份 / 恢复 ================= */
function showExport(){
  var data=JSON.stringify({v:3,rec:S.rec,wb:S.wb,star:S.star,hist:S.hist,set:S.set});
  openLayer('<div class="sh-head"><b>备份进度</b><button class="icobtn" data-close aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sh-body"><p>复制下面整段文字，存到备忘录或发给自己；到另一个浏览器里点"恢复进度"粘贴。包含做题记录、错题本、收藏和考试记录。</p><textarea class="code" id="exTxt" readonly>'+esc(data)+'</textarea><button class="btn pri" id="exCopy" style="max-width:none;margin:0">复制</button></div>');
  [].forEach.call(layer.querySelectorAll('[data-close]'),function(b){b.onclick=closeLayer;});
  $('exCopy').onclick=function(){
    var ta=$('exTxt');ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
    var done=function(){toast('已复制');};
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(ta.value).then(done,function(){try{document.execCommand('copy');done();}catch(e){toast('请长按文字手动复制');}});}
    else{try{document.execCommand('copy')?done():toast('请长按文字手动复制');}catch(e){toast('请长按文字手动复制');}}
  };
}
function showImport(){
  openLayer('<div class="sh-head"><b>恢复进度</b><button class="icobtn" data-close aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sh-body"><p>把备份的文字粘贴进来。会和当前记录合并：做题次数相加，错题和收藏取并集。</p><textarea class="code" id="imTxt" placeholder="在这里粘贴"></textarea><button class="btn pri" id="imGo" style="max-width:none;margin:0">恢复</button></div>');
  [].forEach.call(layer.querySelectorAll('[data-close]'),function(b){b.onclick=closeLayer;});
  $('imGo').onclick=function(){
    var d;try{d=JSON.parse($('imTxt').value.trim());}catch(e){return toast('内容不完整，请重新复制整段');}
    if(!d||!d.rec)return toast('这不是本题库的备份');
    var n=0;
    for(var id in d.rec){if(!QM[id])continue;var a=S.rec[id]||{a:0,k:0,l:0},b=d.rec[id];S.rec[id]={a:a.a+b.a,k:a.k+b.k,l:b.l};n++;}
    for(id in (d.wb||{}))if(QM[id]&&!S.wb[id])S.wb[id]=d.wb[id];
    for(id in (d.star||{}))if(QM[id])S.star[id]=1;
    if(d.hist)S.hist=S.hist.concat(d.hist).sort(function(x,y){return y.t-x.t;}).slice(0,20);
    save();closeLayer();renderHome();toast('已恢复 '+n+' 题的记录');
  };
}

/* ================= 键盘（电脑） ================= */
document.addEventListener('keydown',function(e){
  if(layer.innerHTML){if(e.key==='Escape')closeLayer();return;}
  if(!R.mode||R.mode==='search'||R.mode==='topics'||R.mode==='secs'||R.mode==='result'||e.metaKey||e.ctrlKey||e.altKey)return;
  var q=QM[R.ids[R.i]];if(!q)return;
  var k=e.key.toUpperCase();
  var n=L.indexOf(k);if(n<0&&k>='1'&&k<='6')n=+k-1;
  if(q.type!=='qa'&&n>=0&&n<q.options.length){e.preventDefault();pick(L[n]);return;}
  if(e.key==='Enter'){e.preventDefault();var nb=$('dNext');if(nb)nb.click();return;}
  if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}
  if(e.key==='ArrowRight'){e.preventDefault();move(1);}
});
document.addEventListener('visibilitychange',function(){if(document.hidden)saveExam();else if(R.mode==='exam')lastTick=Date.now();});

renderHome();
})();
</script>
